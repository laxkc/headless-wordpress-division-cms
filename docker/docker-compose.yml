services:
  db:
    image: mysql:8.0
    container_name: northium_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpw"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    container_name: northium_wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('NORTHIUM_REVALIDATE_URL', 'http://host.docker.internal:3000/api/revalidate');
        define('NORTHIUM_REVALIDATE_SECRET', 'local-dev-secret-change-me');
    volumes:
      - wp_core:/var/www/html
      - ../wp-content:/var/www/html/wp-content

  adminer:
    image: adminer:latest
    container_name: northium_adminer
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8083:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  wpcli:
    image: wordpress:cli-php8.3
    container_name: northium_wpcli
    profiles: ["cli"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('NORTHIUM_REVALIDATE_URL', 'http://host.docker.internal:3000/api/revalidate');
        define('NORTHIUM_REVALIDATE_SECRET', 'local-dev-secret-change-me');
    volumes:
      - wp_core:/var/www/html
      - ../wp-content:/var/www/html/wp-content
    entrypoint: ["wp", "--allow-root"]
    command: ["--info"]

volumes:
  db_data:
  wp_core:
